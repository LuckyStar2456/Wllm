name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build and native checks
        run: ./scripts/build.ps1 -BuildDirectory build/public -Jobs 4
      - name: CLI and ConPTY checks
        run: |
          python -m pip install pywinpty==2.0.15 numpy==1.26.4 PyYAML==6.0.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WLLM_EXE = (Resolve-Path build/public/bin/Release/wllm.exe).Path
          python -B -m unittest discover -s tests -p test_public.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests -p test_console.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests -p test_architectures.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: wllm-windows-x64
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wllm-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body_path: CHANGELOG.md
